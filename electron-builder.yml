# 14단계 패키징 — `npm run package` (빌드 → .app → 정적 검사). 이 Mac 용: ad-hoc 서명 · dir.
# 18단계 배포 — `npm run release` (scripts/release.mjs): 같은 설정에 Developer ID 인증서 · dmg + zip 을 더하고 공증(APPLE_KEYCHAIN_PROFILE).
appId: io.peterbong.taskminal
productName: Taskminal
directories:
  output: dist
files:
  - out/**
  - package.json
  # 이 앱은 arm64 mac 만 — 다른 플랫폼의 node-pty 미리 빌드는 넣지 않는다
  - "!node_modules/node-pty/prebuilds/{win32-*,darwin-x64}/**"
# 네이티브 모듈 · spawn-helper 는 asar 안에서 실행할 수 없다
asarUnpack:
  - node_modules/node-pty/**
# node-pty 는 N-API 미리 빌드(prebuilds/darwin-arm64)를 쓴다 — 다시 컴파일하지 않는다
npmRebuild: false
# 셸 통합 시작 파일 — zsh 가 직접 읽으므로 asar 밖 Resources/shell/zsh 에 (main 이 app.isPackaged 면 여기를 본다).
# 점 파일(.zshrc …)도 들어간다(electron-builder 의 기본 거르기가 점 파일을 포함 — 변이로 확인, check-package 가 본다)
# 개발 중 이 폴더에 생길 수 있는 zsh 기록 · 캐시는 넣지 않는다(개발자의 명령 기록이 .app 에 실린다 — check-package 가 목록 밖 파일을 막는다)
extraResources:
  - from: resources/shell
    to: shell
    filter:
      - "**/*"
      - "!**/.zsh_history"
      - "!**/.zcompdump*"
      - "!**/.zsh_sessions/**"
  # 24단계 `taskminal` 명령 — sh 로 asar 밖에 (메뉴 '명령줄 도구 설치…' 가 /usr/local/bin 에 링크)
  - from: resources/bin
    to: bin
afterPack: scripts/after-pack.cjs
mac:
  target:
    - target: dir
      arch: [arm64]
  icon: resources/icon/icon.icns
  category: public.app-category.developer-tools
  # 개발자 인증서 없이 ad-hoc 서명 — null(서명 안 함)이면 Electron 링커 서명(Identifier=Electron)이 남아 번들 서명이 깨진다
  identity: "-"
  # 18단계: 공증에 필요한 hardened runtime 을 이 Mac 용에도 켠다(배포본과 같은 조건으로 시험 — tests/e2e/packaged.spec.ts).
  # ad-hoc 에는 disable-library-validation 이 있어야 뜬다(electron-builder 경고 · 18단계 스파이크)
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
# 18단계: 자동 업데이트 받는 곳 = GitHub Releases (2026-11-11 사용자 결정, NAS 대신). app-update.yml 을 넣으려고 둔다 —
# 게시는 하지 않는다(package · release 모두 --publish never). 릴리스 올리기는 사용자 확인 뒤.
publish:
  - provider: github
    owner: petercorders
    repo: taskminal
